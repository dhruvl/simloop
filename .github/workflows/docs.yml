name: Docs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One deployment at a time, and a push that lands mid-deploy wins.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.13"
      - run: uv sync --group docs
      - run: uv run --group docs mkdocs build --strict
      # exclude_docs filters theme files too, and a build stripped of its
      # stylesheets is still a green build — deploying bare HTML taught that.
      - run: ls site/assets/stylesheets/main.*.min.css
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
